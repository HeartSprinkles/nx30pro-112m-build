name: Build ImmortalWrt (NX30 Pro 112M)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: '25.12'
  THEME_URL: https://github.com/rchen14b/luci-theme-glass
  NIKKI_FEED: https://github.com/nikkinikki-org/OpenWrt-nikki
  DEVICE: h3c_magic-nx30-pro-112m
  TZ: Asia/Shanghai
  # 改这个值可以强制让编译缓存失效（源码大版本升级、gcc 变动时用）
  CACHE_VER: v1

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "CPU: $(nproc)  RAM: $(free -h | awk '/Mem:/{print $2}')"
          df -h /

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache \
                      /opt/ghc /usr/local/share/boost /usr/local/.ghcup /opt/az
          sudo apt-get -qq clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get -y install --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync unzip zlib1g-dev file wget curl ccache \
            subversion time

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.REPO_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.REPO_BRANCH }}-

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth 1 -b "${REPO_BRANCH}" "${REPO_URL}" openwrt
          cd openwrt
          echo "source commit: $(git log -1 --pretty='%H %s')"
          echo "kernel: $(sed -n 's/^KERNEL_PATCHVER:=//p' target/linux/mediatek/Makefile)"

      # 关键提速点：工具链(交叉编译器) + host 工具 是单次构建里最贵的一段
      # (约 45~60 分钟)。它们只跟源码分支/gcc 版本有关，跟我们的 DTS/软件包无关，
      # 缓存下来后续构建直接复用，不用每次从头编。
      # dl/ 是源码包缓存，命中后能省掉几分钟下载，也避免上游抽风导致失败。
      - name: Restore build cache (dl + toolchain + host tools)
        id: buildcache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
          key: owrt-${{ env.CACHE_VER }}-${{ env.REPO_BRANCH }}-${{ hashFiles('configs/**', 'device/**', 'dts/**') }}
          restore-keys: |
            owrt-${{ env.CACHE_VER }}-${{ env.REPO_BRANCH }}-

      - name: Cache status
        run: |
          if [ "${{ steps.buildcache.outputs.cache-hit }}" = "true" ]; then
            echo "✅ 命中缓存：跳过工具链/host 工具编译"
          else
            echo "❌ 未命中（首次或配置有变更），本次会全量编工具链"
          fi

      - name: Add nikki feed and Glass theme
        run: |
          cd openwrt
          echo "src-git nikki ${NIKKI_FEED};main" >> feeds.conf.default
          git clone --depth 1 "${THEME_URL}" package/luci-theme-glass
          echo "--- feeds.conf.default ---"
          cat feeds.conf.default

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply NX30 Pro 112M support
        run: bash scripts/apply-nx30pro-112m.sh openwrt

      - name: Configure
        run: |
          cp configs/nx30pro-112m.config openwrt/.config
          cd openwrt
          make defconfig

          echo "--- 关键配置校验 ---"
          rc=0
          # CONFIG_TARGET_PROFILE 是最终决定编哪个设备的东西，比设备符号更可靠
          grep -qx 'CONFIG_TARGET_PROFILE="DEVICE_h3c_magic-nx30-pro-112m"' .config \
            || { echo "::error::TARGET_PROFILE 不是 h3c_magic-nx30-pro-112m（设备定义未生效？）"; rc=1; }
          grep -qx 'CONFIG_PACKAGE_luci-theme-glass=y' .config \
            || { echo "::error::luci-theme-glass 未被选中"; rc=1; }
          grep -qx 'CONFIG_PACKAGE_luci-app-nikki=y' .config \
            || { echo "::error::luci-app-nikki 未被选中"; rc=1; }
          grep -qE '^CONFIG_PACKAGE_mihomo(-meta)?=y' .config \
            || { echo "::error::mihomo 内核未被选中"; rc=1; }
          if [ "$rc" != "0" ]; then
            grep -E 'h3c|nikki|glass|mihomo' .config || true
            exit 1
          fi
          grep -E 'CONFIG_TARGET_PROFILE|DEVICE_h3c|CONFIG_PACKAGE_(luci-app-nikki|luci-theme-glass|mihomo)|CONFIG_CCACHE' .config

      - name: Download package sources
        continue-on-error: true
        run: |
          cd openwrt
          make -j"$(nproc)" download

      - name: Build firmware
        run: |
          set -o pipefail
          cd openwrt
          # 限制 ccache 体积，避免把它和工具链缓存一起撑爆 GitHub 的 10GB 缓存额度
          ccache -M 2G >/dev/null 2>&1 || true
          ccache -z >/dev/null 2>&1 || true
          make -j"$(nproc)" 2>&1 | tee build.log
          ccache -s || true

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log
          if-no-files-found: ignore

      - name: Verify image contents
        run: |
          cd openwrt/bin/targets/mediatek/filogic
          MAN="$(ls *.manifest 2>/dev/null | head -1 || true)"
          if [ -z "$MAN" ]; then echo "::warning::未找到 .manifest，跳过校验"; exit 0; fi
          echo "manifest: $MAN"
          rc=0
          # .config / config.buildinfo 在 ImmortalWrt 里会被裁剪，不可靠；
          # .manifest 才是最终进镜像的包清单。
          for p in kmod-mt7915e kmod-mt7981-firmware mt7981-wo-firmware wpad-openssl \
                   luci-theme-glass luci-app-nikki nikki mihomo; do
            if grep -qE "^${p}[[:space:]-]" "$MAN"; then
              echo "✓ $p"
            else
              echo "::error::镜像里缺少 $p"
              rc=1
            fi
          done
          if [ "$rc" != "0" ]; then
            echo "--- 实际包含的相关包 ---"
            grep -iE "mt79|wpad|glass|nikki|mihomo" "$MAN" || true
            exit 1
          fi
          echo "--- WiFi 相关包 ---"
          grep -iE "mt7915|mt7981|wpad" "$MAN"

      - name: Collect firmware
        run: |
          mkdir -p artifacts
          ls -lh openwrt/bin/targets/mediatek/filogic/
          find openwrt/bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name '*sysupgrade.itb' -o -name '*recovery.itb' -o -name 'sha256sums' \
               -o -name 'profiles.json' -o -name 'config.buildinfo' -o -name '*.manifest' \) \
            -exec cp -v {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ env.DEVICE }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 6

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
