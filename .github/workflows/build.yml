name: Build ImmortalWrt (NX30 Pro 112M)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: '25.12'
  THEME_URL: https://github.com/rchen14b/luci-theme-glass
  NIKKI_FEED: https://github.com/nikkinikki-org/OpenWrt-nikki
  DEVICE: h3c_magic-nx30-pro-112m
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "CPU: $(nproc)  RAM: $(free -h | awk '/Mem:/{print $2}')"
          df -h /

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache \
                      /opt/ghc /usr/local/share/boost /usr/local/.ghcup /opt/az
          sudo apt-get -qq clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get -y install --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync unzip zlib1g-dev file wget curl ccache \
            subversion time

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.REPO_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.REPO_BRANCH }}-

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth 1 -b "${REPO_BRANCH}" "${REPO_URL}" openwrt
          cd openwrt
          echo "source commit: $(git log -1 --pretty='%H %s')"
          echo "kernel: $(sed -n 's/^KERNEL_PATCHVER:=//p' target/linux/mediatek/Makefile)"

      - name: Add nikki feed and Glass theme
        run: |
          cd openwrt
          echo "src-git nikki ${NIKKI_FEED};main" >> feeds.conf.default
          git clone --depth 1 "${THEME_URL}" package/luci-theme-glass
          echo "--- feeds.conf.default ---"
          cat feeds.conf.default

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply NX30 Pro 112M support
        run: bash scripts/apply-nx30pro-112m.sh openwrt

      - name: Configure
        run: |
          cp configs/nx30pro-112m.config openwrt/.config
          cd openwrt
          make defconfig

          echo "--- 关键配置校验 ---"
          rc=0
          grep -qx 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_h3c_magic-nx30-pro-112m=y' .config \
            || { echo "::error::设备 h3c_magic-nx30-pro-112m 未被选中（设备定义未生效？）"; rc=1; }
          grep -qx 'CONFIG_PACKAGE_luci-theme-glass=y' .config \
            || { echo "::error::luci-theme-glass 未被选中"; rc=1; }
          grep -qx 'CONFIG_PACKAGE_luci-app-nikki=y' .config \
            || { echo "::error::luci-app-nikki 未被选中"; rc=1; }
          if [ "$rc" != "0" ]; then
            grep -E 'h3c|nikki|glass|mihomo' .config || true
            exit 1
          fi
          grep -E 'CONFIG_TARGET_DEVICE_.*h3c|CONFIG_PACKAGE_(luci-app-nikki|luci-theme-glass|mihomo)|CONFIG_CCACHE' .config

      - name: Download package sources
        continue-on-error: true
        run: |
          cd openwrt
          make -j"$(nproc)" download

      - name: Build firmware
        run: |
          set -o pipefail
          cd openwrt
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log
          if-no-files-found: ignore

      - name: Collect firmware
        run: |
          mkdir -p artifacts
          ls -lh openwrt/bin/targets/mediatek/filogic/
          find openwrt/bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name '*sysupgrade.itb' -o -name '*recovery.itb' -o -name 'sha256sums' \
               -o -name 'profiles.json' -o -name 'config.buildinfo' \) \
            -exec cp -v {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ env.DEVICE }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 6

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
