name: Build ImmortalWrt (NX30 Pro 112M)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: '25.12'
  NIKKI_FEED: https://github.com/nikkinikki-org/OpenWrt-nikki
  DEVICE: h3c_magic-nx30-pro-112m
  TZ: Asia/Shanghai
  # 改这个值可以强制让编译缓存失效（源码大版本升级、gcc 变动时用）
  CACHE_VER: v1

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runner (info + free disk)
        run: |
          echo "CPU: $(nproc)  RAM: $(free -h | awk '/Mem:/{print $2}')"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache \
                      /opt/ghc /usr/local/share/boost /usr/local/.ghcup /opt/az
          sudo apt-get -qq clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      # 模板开了 CONFIG_DEVEL + CONFIG_TOOLCHAINOPTS，工具链会按源码自带的配置重建，
      # 因此这里用 ImmortalWrt 官方文档的完整依赖列表，避免缺 host 依赖导致中途失败。
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get -y install --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd time

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.REPO_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.REPO_BRANCH }}-

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth 1 -b "${REPO_BRANCH}" "${REPO_URL}" openwrt
          cd openwrt
          echo "source commit: $(git log -1 --pretty='%H %s')"
          echo "kernel: $(sed -n 's/^KERNEL_PATCHVER:=//p' target/linux/mediatek/Makefile)"

      # 关键提速点：工具链(交叉编译器) + host 工具 是单次构建里最贵的一段
      # (约 45~60 分钟)。它们只跟源码分支/gcc 版本有关，跟我们的 DTS/软件包无关，
      # 缓存下来后续构建直接复用，不用每次从头编。
      # dl/ 是源码包缓存，命中后能省掉几分钟下载，也避免上游抽风导致失败。
      - name: Restore build cache (dl + toolchain + host tools)
        id: buildcache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
          key: owrt-${{ env.CACHE_VER }}-${{ env.REPO_BRANCH }}-${{ hashFiles('configs/**', 'device/**', 'dts/**') }}
          restore-keys: |
            owrt-${{ env.CACHE_VER }}-${{ env.REPO_BRANCH }}-

      - name: Cache status
        run: |
          if [ "${{ steps.buildcache.outputs.cache-hit }}" = "true" ]; then
            echo "✅ 命中缓存：跳过工具链/host 工具编译"
          else
            echo "❌ 未命中（首次或配置有变更），本次会全量编工具链"
          fi

      - name: Add nikki feed
        run: |
          cd openwrt
          echo "src-git nikki ${NIKKI_FEED};main" >> feeds.conf.default
          echo "--- feeds.conf.default ---"
          cat feeds.conf.default

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply NX30 Pro 112M support
        run: bash scripts/apply-nx30pro-112m.sh openwrt

      # 以源码自带的 defconfig/mt7981-ax3000.config 为基准，
      # 保留其全部软件包/工具链/DEVEL 设置，只把设备列表裁到我们这一个。
      # 所有硬性校验都在 scripts/configure.sh 里（与 config-check 工作流共用）。
      - name: Configure
        run: |
          bash scripts/configure.sh openwrt
          cd openwrt
          echo "--- 关键行 ---"
          grep -E 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y|CONFIG_PACKAGE_(luci-app-nikki|mihomo)|CONFIG_CCACHE|CONFIG_DEVEL' .config || true

      - name: Download package sources
        continue-on-error: true
        run: |
          cd openwrt
          make -j"$(nproc)" download

      - name: Build firmware
        run: |
          set -o pipefail
          cd openwrt
          # 限制 ccache 体积，避免把它和工具链缓存一起撑爆 GitHub 的 10GB 缓存额度
          ccache -M 2G >/dev/null 2>&1 || true
          ccache -z >/dev/null 2>&1 || true
          make -j"$(nproc)" 2>&1 | tee build.log
          ccache -s || true

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log
          if-no-files-found: ignore

      # .config / config.buildinfo 在 ImmortalWrt 里会被裁剪，不可靠；
      # .manifest 才是最终进镜像的包清单。
      # WiFi 走 MTK 闭源 mt_wifi（mtk-openwrt-feeds），不是开源 mt76。
      - name: Verify image contents
        run: |
          cd openwrt/bin/targets/mediatek/filogic
          MAN="$(ls *.manifest 2>/dev/null | head -1 || true)"
          if [ -z "$MAN" ]; then echo "::warning::未找到 .manifest，跳过校验"; exit 0; fi
          echo "manifest: $MAN"
          rc=0
          for p in kmod-mt_wifi mtwifi-cfg-ucode luci-app-mtwifi-cfg \
                   luci-app-nikki nikki mihomo; do
            if grep -qE "^${p}[[:space:]-]" "$MAN"; then
              echo "✓ $p"
            else
              echo "::error::镜像里缺少 $p"
              rc=1
            fi
          done
          # 反向检查：mt76 与 mt_wifi 抢同一硬件，不能共存
          if grep -qE '^kmod-mt7915e[[:space:]-]' "$MAN"; then
            echo "::error::镜像里同时出现 kmod-mt7915e（开源 mt76），会与 mt_wifi 冲突"
            rc=1
          fi
          if [ "$rc" != "0" ]; then
            echo "--- 实际包含的相关包 ---"
            grep -iE "mt_wifi|mtwifi|mt79|wpad|nikki|mihomo" "$MAN" || true
            exit 1
          fi
          echo "--- WiFi 相关包 ---"
          grep -iE "mt_wifi|mtwifi|wpad" "$MAN"

      - name: Collect firmware
        run: |
          mkdir -p artifacts
          ls -lh openwrt/bin/targets/mediatek/filogic/
          find openwrt/bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name '*sysupgrade.itb' -o -name '*recovery.itb' -o -name 'sha256sums' \
               -o -name 'profiles.json' -o -name 'config.buildinfo' -o -name '*.manifest' \
               -o -name 'feeds.buildinfo' \) \
            -exec cp -v {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ env.DEVICE }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 6

      # 每次构建成功都发 Release（不再只限打 tag）。
      # 打 tag 触发时用该 tag；手动触发时用 v25.12-112m-YYYYMMDD-HHMM。
      - name: Make release tag
        id: rel
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v25.12-112m-$(date +%Y%m%d-%H%M)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ImmortalWrt 25.12 · NX30 Pro 112M · ${{ steps.rel.outputs.tag }}
          files: artifacts/*
          body: |
            ## H3C Magic NX30 Pro 112M (MTK U-Boot layout)

            | 项 | 值 |
            | --- | --- |
            | 源码 | `chasey-dev/immortalwrt-mt798x-rebase` @ `25.12`（kernel 6.12） |
            | 配置 | 源码自带 `defconfig/mt7981-ax3000.config`，设备列表裁到本机型一个 |
            | 分区 | 112M 大分区（`ubi` 0x580000 + 0x7000000） |
            | WiFi | MTK 闭源 **mt_wifi**（`kmod-mt_wifi` + `mtwifi-cfg-ucode` + `luci-app-mtwifi-cfg`），不含 mt76 |
            | 主题 | luci-theme-argon（模板自带） |
            | 代理 | nikki + mihomo |
            | 构建 | Actions run `${{ github.run_id }}` |

            ### 刷机

            1. 网线接 LAN，进 u-boot failsafe（`http://192.168.1.1`），**先 Backup 整片 flash**
            2. 确认 MTD layout = `immortalwrt-112m`（ubi = 112M）
            3. 固件升级页上传 `*-sysupgrade.itb`；`*-recovery.itb` 可内存启动验证
            4. 刷机前记录原机 MAC（112M 布局会覆盖 `pdt_data_1`）

            > 本固件在 `bl-mt798x default`（NMBM）变体上实测可启动：该闪存 0 坏块、
            > NMBM 映射恒等，内核虽无 NMBM 驱动也能正确读取。
